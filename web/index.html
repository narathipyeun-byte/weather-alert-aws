<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ฝนตกไหม? พยากรณ์รายจังหวัด</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;700&display=swap">
<style>
:root{--bg:#e9eef2;--ink:#14212b;--mute:#5b6b78;--rain:#1f5fbf;--line:#c4d0d9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 "IBM Plex Sans Thai","Sarabun",system-ui,sans-serif}
main{max-width:46rem;margin:0 auto;padding:2rem 1.25rem 3rem}
label{color:var(--mute);font-size:.9rem}
select{display:block;margin-top:.25rem;font:inherit;padding:.55rem .75rem;border:2px solid var(--ink);background:#fff;color:var(--ink);min-width:16rem}
select:focus-visible{outline:3px solid var(--rain);outline-offset:2px}
h1{font-size:clamp(2.4rem,9vw,4.6rem);line-height:1.1;margin:1.5rem 0 .5rem;font-weight:700}
.sub{color:var(--mute);margin:0 0 1.5rem}
.bars{display:flex;align-items:flex-end;gap:3px;height:7rem;border-bottom:2px solid var(--ink)}
.bars i{flex:1;background:var(--rain);min-height:2px}
.axis{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;margin:.25rem 0 1.5rem}
dl{display:grid;grid-template-columns:1fr auto;margin:0;border-top:1px solid var(--line)}
dt,dd{margin:0;padding:.6rem 0;border-bottom:1px solid var(--line)}
dd{font-weight:700;text-align:right}
.flags{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.5rem;padding:0;list-style:none}
.flags li{border:2px solid var(--ink);padding:.15rem .7rem;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{padding:.55rem .25rem;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:400;font-size:.9rem}td:last-child,th:last-child{text-align:right}h2{font-size:1.2rem;margin:2rem 0 .25rem}
.note{color:var(--mute);font-size:.85rem;margin-top:2rem}
</style>
</head>
<body>
<main>
  <label for="prov">เลือกจังหวัด</label>
  <select id="prov"></select>
  <section id="out" aria-live="polite">กำลังโหลด...</section>
  <p class="note">ข้อมูลพยากรณ์จาก Open-Meteo (24 ชั่วโมงข้างหน้า) พิกัดเป็นตัวเมืองโดยประมาณ เกณฑ์สรุปผลเป็นกฎของโปรเจกต์นี้ ไม่ใช่ข้อมูลทางการของกรมอุตุนิยมวิทยา</p>
</main>
<script>
// ใส่ Lambda Function URL ที่นี่ตอนต่อ AWS (ว่างไว้ = ดึง Open-Meteo ตรงๆ)
const API_URL = "";

// [ชื่อจังหวัด, lat, lon]
const PROVINCES = [
["กรุงเทพมหานคร",13.7563,100.5018],["กระบี่",8.0863,98.9063],["กาญจนบุรี",14.0228,99.5328],["กาฬสินธุ์",16.4322,103.5065],["กำแพงเพชร",16.4828,99.5227],
["ขอนแก่น",16.4419,102.8360],["จันทบุรี",12.6114,102.1039],["ฉะเชิงเทรา",13.6904,101.0780],["ชลบุรี",13.3611,100.9847],["ชัยนาท",15.1852,100.1251],
["ชัยภูมิ",15.8068,102.0316],["ชุมพร",10.4930,99.1800],["เชียงราย",19.9072,99.8310],["เชียงใหม่",18.7883,98.9853],["ตรัง",7.5563,99.6114],
["ตราด",12.2428,102.5175],["ตาก",16.8840,99.1258],["นครนายก",14.2069,101.2131],["นครปฐม",13.8199,100.0443],["นครพนม",17.4108,104.7783],
["นครราชสีมา",14.9799,102.0977],["นครศรีธรรมราช",8.4304,99.9631],["นครสวรรค์",15.7047,100.1372],["นนทบุรี",13.8591,100.5217],["นราธิวาส",6.4264,101.8253],
["น่าน",18.7756,100.7730],["บึงกาฬ",18.3609,103.6464],["บุรีรัมย์",14.9930,103.1029],["ปทุมธานี",14.0208,100.5250],["ประจวบคีรีขันธ์",11.8126,99.7957],
["ปราจีนบุรี",14.0509,101.3727],["ปัตตานี",6.8695,101.2505],["พระนครศรีอยุธยา",14.3532,100.5689],["พะเยา",19.1664,99.9019],["พังงา",8.4509,98.5255],
["พัทลุง",7.6167,100.0740],["พิจิตร",16.4429,100.3488],["พิษณุโลก",16.8211,100.2659],["เพชรบุรี",13.1119,99.9390],["เพชรบูรณ์",16.4190,101.1606],
["แพร่",18.1445,100.1410],["ภูเก็ต",7.8804,98.3923],["มหาสารคาม",16.1851,103.3026],["มุกดาหาร",16.5426,104.7235],["แม่ฮ่องสอน",19.3010,97.9685],
["ยโสธร",15.7926,104.1453],["ยะลา",6.5411,101.2804],["ร้อยเอ็ด",16.0538,103.6520],["ระนอง",9.9529,98.6085],["ระยอง",12.6814,101.2816],
["ราชบุรี",13.5283,99.8134],["ลพบุรี",14.7995,100.6534],["ลำปาง",18.2888,99.4908],["ลำพูน",18.5746,99.0087],["เลย",17.4860,101.7223],
["ศรีสะเกษ",15.1186,104.3220],["สกลนคร",17.1664,104.1486],["สงขลา",7.1756,100.6143],["สตูล",6.6238,100.0674],["สมุทรปราการ",13.5991,100.5998],
["สมุทรสงคราม",13.4098,100.0023],["สมุทรสาคร",13.5475,100.2744],["สระแก้ว",13.8240,102.0646],["สระบุรี",14.5289,100.9100],["สิงห์บุรี",14.8936,100.3967],
["สุโขทัย",17.0056,99.8264],["สุพรรณบุรี",14.4745,100.1222],["สุราษฎร์ธานี",9.1382,99.3217],["สุรินทร์",14.8818,103.4937],["หนองคาย",17.8783,102.7413],
["หนองบัวลำภู",17.2041,102.4407],["อ่างทอง",14.5896,100.4550],["อำนาจเจริญ",15.8657,104.6258],["อุดรธานี",17.4138,102.7870],["อุตรดิตถ์",17.6201,100.0993],
["อุทัยธานี",15.3835,100.0245],["อุบลราชธานี",15.2287,104.8564]
];

const sel = document.getElementById("prov"), out = document.getElementById("out");
PROVINCES.forEach(([n], i) => sel.add(new Option(n, i)));
try { sel.value = localStorage.getItem("prov") || 0; } catch (e) {}

// ตัวคำนวณ (ตอนต่อ AWS จะย้ายตรรกะนี้ไปไว้ใน Lambda)
function compute(d) {
  const t0 = d.current.time.slice(0, 13) + ":00";
  const s = d.hourly.time.findIndex(t => t >= t0);
  const pick = k => d.hourly[k].slice(s, s + 24).map(x => x ?? 0);
  const sum = a => a.reduce((x, y) => x + y, 0);
  const prob = pick("precipitation_probability"), temp = pick("temperature_2m");
  const r = {
    now: d.current.temperature_2m, feels: d.current.apparent_temperature,
    tMin: Math.min(...temp), tMax: Math.max(...temp),
    probAvg6: Math.round(sum(prob.slice(0, 6)) / 6),
    rainMm: +sum(pick("precipitation")).toFixed(1),
    windMax: Math.max(...pick("wind_speed_10m")), uvMax: Math.max(...pick("uv_index")),
    prob, hours: d.hourly.time.slice(s, s + 24)
  };
  r.flags = { rain: r.probAvg6 >= 60 || r.rainMm >= 1, cold: r.tMin <= 22, hot: r.tMax >= 36, wind: r.windMax >= 30, uv: r.uvMax >= 8 };
  r.days = d.daily.time.map((t, i) => {
    const x = { date: t, tMax: d.daily.temperature_2m_max[i], tMin: d.daily.temperature_2m_min[i],
      prob: d.daily.precipitation_probability_max[i] ?? 0, mm: d.daily.precipitation_sum[i] ?? 0,
      wind: d.daily.wind_speed_10m_max[i], uv: d.daily.uv_index_max[i] };
    x.flags = { rain: x.prob >= 60 || x.mm >= 1, cold: x.tMin <= 22, hot: x.tMax >= 36, wind: x.wind >= 30, uv: x.uv >= 8 };
    return x;
  });
  return r;
}

const TEXT = {
  rain: ["ควรพกร่ม", "🌧 ฝนจะตก"], cold: ["อากาศเย็น เตรียมเสื้อกันหนาว", "🥶 อากาศเย็น"],
  hot: ["ร้อนจัด ดื่มน้ำบ่อยๆ", "🥵 ร้อนจัด"], wind: ["ลมแรง ระวังของปลิว", "💨 ลมแรง"],
  uv: ["แดดแรง ทาครีมกันแดด", "☀️ UV สูง"]
};

function show(name, r) {
  const on = Object.keys(TEXT).filter(k => r.flags[k]);
  const head = on.length ? TEXT[on[0]][0] : "อากาศปกติ ออกจากบ้านได้สบาย";
  const chips = on.map(k => `<li>${TEXT[k][1]}</li>`).join("");
  const bars = r.prob.map((p, i) => `<i style="height:${p}%" title="${r.hours[i].slice(11)} น. ฝน ${p}%"></i>`).join("");
  const rows = (r.days || []).map(x => {
    const d = new Date(x.date + "T00:00:00+07:00").toLocaleDateString("th-TH", { weekday: "short", day: "numeric", month: "short" });
    const ic = Object.keys(TEXT).filter(k => x.flags[k]).map(k => TEXT[k][1].split(" ")[0]).join(" ") || "✅";
    return `<tr><td>${d}</td><td>${ic}</td><td>${x.tMin}° – ${x.tMax}°</td><td>${x.prob}% / ${x.mm} มม.</td></tr>`;
  }).join("");
  out.innerHTML = `
    <h1>${head}</h1>
    <p class="sub">${name} ใน 24 ชั่วโมงข้างหน้า</p>
    ${chips ? `<ul class="flags">${chips}</ul>` : ""}
    <div class="bars" aria-label="โอกาสฝนรายชั่วโมง">${bars}</div>
    <div class="axis"><span>${r.hours[0].slice(11)} น.</span><span>โอกาสฝนรายชั่วโมง</span><span>${r.hours[23].slice(11)} น.</span></div>
    <dl>
      <dt>อุณหภูมิตอนนี้ (รู้สึกเหมือน)</dt><dd>${r.now}° (${r.feels}°)</dd>
      <dt>ต่ำสุด–สูงสุด</dt><dd>${r.tMin}° – ${r.tMax}°</dd>
      <dt>โอกาสฝนเฉลี่ย 6 ชม.แรก</dt><dd>${r.probAvg6}%</dd>
      <dt>ปริมาณฝนรวม</dt><dd>${r.rainMm} มม.</dd>
      <dt>ลมแรงสุด</dt><dd>${r.windMax} กม./ชม.</dd>
      <dt>UV สูงสุด</dt><dd>${r.uvMax}</dd>
    </dl>
    <h2>พยากรณ์ 7 วัน</h2>
    <table><thead><tr><th>วัน</th><th>สภาพ</th><th>ต่ำ–สูง</th><th>ฝนสูงสุด / รวม</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function load() {
  const [name, lat, lon] = PROVINCES[sel.value];
  try { localStorage.setItem("prov", sel.value); } catch (e) {}
  out.textContent = "กำลังโหลด...";
  try {
    let r;
    if (API_URL) {
      r = await (await fetch(`${API_URL}?lat=${lat}&lon=${lon}`)).json();
    } else {
      const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature&hourly=temperature_2m,precipitation_probability,precipitation,wind_speed_10m,uv_index&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,uv_index_max&timezone=Asia%2FBangkok&forecast_days=7`;
      const res = await fetch(u);
      if (!res.ok) throw new Error(res.status);
      r = compute(await res.json());
    }
    show(name, r);
  } catch (e) {
    out.textContent = "โหลดข้อมูลไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วเลือกจังหวัดอีกครั้ง (" + e.message + ")";
  }
}
sel.addEventListener("change", load);
load();
</script>
</body>
</html>
